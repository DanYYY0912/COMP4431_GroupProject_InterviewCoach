name: Quality
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - run: python -m venv .venv
      - run: .venv/bin/pip install -r requirements.lock && .venv/bin/pip install --no-deps -e backend
      - run: pnpm --dir frontend install --frozen-lockfile && pnpm --dir e2e install --frozen-lockfile
      - run: pnpm --dir e2e exec playwright install --with-deps chromium
      - run: make test
      - run: make eval
      - run: pnpm --dir frontend audit --audit-level high
      - run: make package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-and-source
          path: |
            artifacts/*.zip
            artifacts/*.sha256
            e2e/playwright-report
            evaluation/results
